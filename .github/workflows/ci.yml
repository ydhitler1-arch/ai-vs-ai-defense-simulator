name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 numpy pandas matplotlib seaborn

      # The simulator needs Snort, iptables and the lab VMs at runtime, so CI
      # only checks that the code compiles and has no obvious errors.
      - name: Syntax check
        run: python -m compileall -q att def mon tar

      - name: Lint (errors only)
        run: flake8 att def mon tar --select=E9,F63,F7,F82 --show-source --statistics
